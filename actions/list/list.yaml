runtime: plugin
action:
  title: List Nodes
  description: "List all nodes across platforms"
  options:
    - name: tree
      shorthand: t
      title: Tree
      description: Show as tree with zones and components
      type: boolean
      default: false
  result:
    type: object
    properties:
      nodes:
        type: array
        description: List of nodes
        items:
          type: object
          properties:
            node:
              type: string
              description: Node hostname
            platform:
              type: string
              description: Platform instance
            zones:
              type: array
              description: Zones allocated to this node (tree mode only)
              items:
                type: string
            components:
              type: array
              description: Components running on this node (tree mode only)
              items:
                type: string
