runtime: plugin
action:
  title: Query Nodes
  description: "Query nodes by zone or component"
  arguments:
    - name: identifier
      title: Identifier
      description: Zone or component name to query
      required: true
  options:
    - name: platform
      shorthand: p
      title: Platform
      description: Filter by platform
      type: string
      default: ""
    - name: kind
      shorthand: k
      title: Kind
      description: Identifier kind to skip auto-detection (zone, component)
      type: string
      enum: ["", zone, component]
      default: ""
  result:
    type: object
    description: Query result containing matching nodes
    properties:
      nodes:
        type: array
        description: List of nodes matching the query
        items:
          type: object
          properties:
            node:
              type: string
              description: Node hostname
            platform:
              type: string
              description: Platform/environment name
    required:
      - nodes
