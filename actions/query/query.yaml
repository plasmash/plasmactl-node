runtime: plugin
action:
  title: Query Nodes
  description: "Query nodes by chassis path or component"
  arguments:
    - name: identifier
      title: Identifier
      description: Chassis path or component name to query
      required: true
  options:
    - name: env
      shorthand: e
      title: Environment
      description: Filter by environment/platform
      type: string
      default: ""
    - name: kind
      shorthand: k
      title: Kind
      description: Identifier kind to skip auto-detection (chassis, component)
      type: string
      enum: [chassis, component]
      default: ""
  result:
    type: object
    description: Query result containing matching nodes
    properties:
      nodes:
        type: array
        description: List of nodes matching the query
        items:
          type: object
          properties:
            node:
              type: string
              description: Node hostname
            platform:
              type: string
              description: Platform/environment name
    required:
      - nodes
