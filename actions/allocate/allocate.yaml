runtime: plugin
action:
  title: Allocate
  description: Allocate a node to zones
  arguments:
    - name: hostname
      title: Hostname
      description: Node hostname
      required: true
    - name: operations
      title: Operations
      description: "Zone operations: ZONE (add), ZONE- (remove), OLD/NEW (replace)"
      type: array
      required: false
  options:
    - name: env
      shorthand: e
      title: Environment
      description: Environment name (looks in inst/<env>/nodes/)
      type: string
      default: ""
  result:
    type: object
    properties:
      hostname:
        type: string
      zones:
        type: array
        items:
          type: string
      modified:
        type: boolean
