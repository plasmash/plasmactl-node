runtime: plugin
action:
  title: Allocate
  description: Allocate a node to chassis sections
  arguments:
    - name: hostname
      title: Hostname
      description: Node hostname
      required: true
    - name: operations
      title: Operations
      description: "Chassis operations: CHASSIS (add), CHASSIS- (remove), OLD/NEW (replace)"
      type: array
      required: false
  options:
    - name: env
      shorthand: e
      title: Environment
      description: Environment name (looks in inst/<env>/nodes/)
      type: string
      default: ""
