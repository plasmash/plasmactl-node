runtime: plugin
action:
  title: Provision Nodes
  description: "Provision infrastructure via OpenTofu using pools from platform.yaml"
  arguments:
    - name: name
      title: Name
      description: The name of the platform to provision nodes for
      required: true
  options:
    - name: dry-run
      title: Dry Run
      description: Generate HCL files but don't apply
      type: boolean
      default: false
    - name: auto-approve
      title: Auto Approve
      description: Skip interactive approval before applying
      type: boolean
      default: false
  result:
    type: object
    properties:
      name:
        type: string
      provider:
        type: string
      nodes:
        type: array
        items:
          type: object
          properties:
            hostname:
              type: string
            public_ip:
              type: string
            private_ip:
              type: string
            pool:
              type: string
      dry_run:
        type: boolean
