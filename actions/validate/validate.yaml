runtime: plugin
action:
  title: Validate Node
  description: "Validate node configuration and check for issues"
  arguments:
    - name: identifier
      title: Identifier
      description: Node hostname or platform name (validates all nodes in platform)
      required: false
  options:
    - name: platform
      shorthand: p
      title: Platform
      description: Platform name (looks in platforms/<platform>/nodes/)
      type: string
      default: ""
  result:
    type: object
    properties:
      nodes:
        type: array
        items:
          type: object
          properties:
            hostname:
              type: string
            platform:
              type: string
            valid:
              type: boolean
            checks:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                  value:
                    type: string
            has_errors:
              type: boolean
      total_nodes:
        type: integer
      valid_nodes:
        type: integer
      has_errors:
        type: boolean
      has_warnings:
        type: boolean
