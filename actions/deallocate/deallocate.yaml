runtime: plugin
action:
  title: Deallocate
  description: Deallocate a node from one or more zones (exact match; use --recursive to cascade)
  arguments:
    - name: hostname
      title: Hostname
      description: Node hostname
      required: true
    - name: zones
      title: Zones
      description: One or more zones to deallocate the node from
      type: array
      required: true
  options:
    - name: platform
      shorthand: p
      title: Platform
      description: Platform name (looks in platforms/<platform>/nodes/)
      type: string
      default: ""
    - name: recursive
      shorthand: r
      title: Recursive
      description: When deallocating a zone that isn't directly allocated but has allocated descendants, cascade-remove those descendants
      type: boolean
      default: false
  result:
    type: object
    properties:
      hostname:
        type: string
      zones:
        type: array
        items:
          type: string
      removed:
        type: array
        items:
          type: string
      modified:
        type: boolean
