runtime: plugin
action:
  title: Join Platform
  description: "Have an existing provider resource join a platform as a pool node (adopts without creating new infrastructure)"
  arguments:
    - name: platform
      title: Platform
      description: The platform to join
      required: true
  options:
    - name: server-id
      title: Server ID
      description: "Provider's canonical resource identifier (OVH: ns<N>.ip-<a>-<b>-<c>.net; Scaleway: sd-<N>). Used as the node yaml filename."
      type: string
      required: true
    - name: pool
      title: Pool
      description: Pool name in platform.yaml to attach the node to
      type: string
      required: true
    - name: hostname
      title: Hostname
      description: |
        Friendly hostname for the joined node. If omitted, the provider's
        display-name (OVH iam.displayName) is used when set, otherwise falls
        back to the canonical server-id. When provided explicitly, the value
        is also written back to the provider via Terraform apply.
      type: string
      required: false
    - name: dry-run
      title: Dry Run
      description: Generate HCL and show plan but don't apply
      type: boolean
      default: false
    - name: auto-approve
      title: Auto Approve
      description: Skip interactive approval before applying
      type: boolean
      default: false
    - name: allow-destructive-update
      title: Allow destructive update
      description: |
        Permit destructive in-place updates (e.g. OVH OS reinstall) under
        --auto-approve. Has no effect without --auto-approve. Default behavior
        when destructive updates appear is an interactive typed-"yes" prompt;
        this flag is only required to proceed non-interactively.
      type: boolean
      default: false
  result:
    type: object
    properties:
      hostname:
        type: string
      platform:
        type: string
      pool:
        type: string
      server_id:
        type: string
      public_ip:
        type: string
      private_ip:
        type: string
      zones:
        type: array
        items:
          type: string
      file:
        type: string
      dry_run:
        type: boolean
